<a class="skip-link" href="#about" (click)="go('about'); $event.preventDefault()">
  Skip to content
</a>

<header class="site-header" [class.site-header--scrolled]="scrolled()">
  <div class="site-header__inner container">
    <button type="button" class="brand" (click)="go('top')">
      <span class="brand__mark" aria-hidden="true">YZ</span>
      <span class="brand__text">
        <span class="brand__name">{{ profile.shortName }}</span>
        <span class="brand__role">{{ profile.role }}</span>
      </span>
    </button>

    <!-- Desktop navigation -->
    <nav class="nav-desktop" aria-label="Sections">
      @for (item of navItems; track item.id) {
        <button
          type="button"
          class="nav-link"
          [class.nav-link--active]="activeSection() === item.id"
          [attr.aria-current]="activeSection() === item.id ? 'true' : null"
          (click)="go(item.id)"
        >
          {{ item.label }}
        </button>
      }
    </nav>

    <div class="header-actions">
      <button
        type="button"
        class="btn btn--ghost btn--icon"
        [attr.aria-label]="themeLabel()"
        [title]="themeLabel()"
        (click)="toggleTheme()"
      >
        <app-icon [name]="theme() === 'dark' ? 'sun' : 'moon'" [size]="18" />
      </button>

      <a class="btn btn--primary header-cta" [href]="'mailto:' + profile.email">
        <app-icon name="mail" [size]="17" />
        <span>Hire me</span>
      </a>

      <button
        type="button"
        class="btn btn--ghost btn--icon nav-toggle"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-drawer"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
        (click)="toggleMenu()"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="20" />
      </button>
    </div>
  </div>

  <!-- Reading progress -->
  <div
    class="progress"
    role="progressbar"
    aria-label="Page scroll progress"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-valuenow]="progressRounded()"
  >
    <div class="progress__bar" [style.width.%]="progress()"></div>
  </div>
</header>

<!-- Mobile drawer -->
<div class="drawer-scrim" [class.drawer-scrim--open]="menuOpen()" (click)="closeMenu()"></div>

<nav
  id="mobile-drawer"
  class="drawer"
  [class.drawer--open]="menuOpen()"
  [attr.inert]="menuOpen() ? null : ''"
  aria-label="Mobile navigation"
>
  <div class="drawer__head">
    <span class="drawer__title">Navigate</span>
    <button
      type="button"
      class="btn btn--ghost btn--icon"
      aria-label="Close menu"
      (click)="closeMenu()"
    >
      <app-icon name="close" [size]="20" />
    </button>
  </div>

  <ul class="drawer__list">
    @for (item of navItems; track item.id; let i = $index) {
      <li class="drawer__item" [style.--i]="i">
        <button
          type="button"
          class="drawer__link"
          [class.drawer__link--active]="activeSection() === item.id"
          (click)="go(item.id)"
        >
          <app-icon [name]="item.icon" [size]="18" />
          <span>{{ item.label }}</span>
          <app-icon class="drawer__chevron" name="arrow-right" [size]="16" />
        </button>
      </li>
    }
  </ul>

  <div class="drawer__foot">
    <a class="btn btn--primary btn--block" [href]="'mailto:' + profile.email" (click)="closeMenu()">
      <app-icon name="mail" [size]="17" />
      <span>Get in touch</span>
    </a>
    <p class="drawer__note">{{ profile.location }}</p>
  </div>
</nav>
